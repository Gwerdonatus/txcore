{% extends "txcore/base.html" %}{% block content %}<div class="panel login"><h1>Welcome back.</h1><p>Sign in to your payment operations workspace.</p>{% if form.errors %}<p class="failed">Sign-in failed. Check your credentials.</p>{% endif %}<form method="post">{% csrf_token %}<label for="id_username">Username</label><input id="id_username" name="username" autocomplete="username" required><label for="id_password">Password</label><input id="id_password" name="password" type="password" autocomplete="current-password" required><input type="hidden" name="next" value="{{ next }}"><button>Sign in</button></form></div>{% endblock %}
