upstream txcore_app {
    server web:8000;
}

limit_req_zone $binary_remote_addr zone=txcore_api:10m rate=100r/s;

server {
    listen 80;
    server_name _;

    location /api/ {
        limit_req zone=txcore_api burst=200 nodelay;
        proxy_pass http://txcore_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /metrics {
        proxy_pass http://txcore_app;
        allow 172.0.0.0/8;
        deny all;
    }

    location / {
        proxy_pass http://txcore_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
